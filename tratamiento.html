<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Módulo de Tratamientos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Gestión de Tratamientos</h1>

    <!-- Agrega este formulario aquí -->
    <form id="formTratamiento">
        <label for="id">ID:</label>
        <input type="number" id="id" required>

        <label for="paciente">Paciente:</label>
        <input type="text" id="paciente" required>

        <label for="descripcion">Descripción:</label>
        <textarea id="descripcion" required></textarea>

        <label for="fecha">Fecha:</label>
        <input type="date" id="fecha" required>

        <button type="submit">Guardar Tratamiento</button>
    </form>

    <script src="tratamiento.js"></script>
</body>
</html>
