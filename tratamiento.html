<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Módulo de Tratamientos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="caja caja-ancha">
        <h1>Gestión de Tratamientos</h1>

        <form id="formTratamiento" novalidate>
            <label for="idTratamiento">ID:</label>
            <input type="number" id="idTratamiento" min="1" placeholder="Ej: 1">

            <label for="paciente">Paciente:</label>
            <input type="text" id="paciente" placeholder="Nombre de la mascota">

            <label for="descripcion">Descripción:</label>
            <textarea id="descripcion" placeholder="Tratamiento indicado"></textarea>

            <label for="fecha">Fecha:</label>
            <input type="date" id="fecha">

            <button type="submit">Guardar Tratamiento</button>
        </form>

        <h3>Tratamientos registrados</h3>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Paciente</th>
                    <th>Descripción</th>
                    <th>Fecha</th>
                </tr>
            </thead>
            <tbody id="tablaTratamientos"></tbody>
        </table>

        <button type="button" id="btnVolver" class="btn-secundario">Volver al dashboard</button>
    </div>

    <script src="modal.js"></script>
    <script src="auth.js"></script>
    <script src="tratamiento.js"></script>
</body>
</html>
