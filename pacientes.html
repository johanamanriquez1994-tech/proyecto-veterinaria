<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pacientes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="caja caja-ancha">
        <h2>Pacientes</h2>

        <form id="formPaciente" novalidate>
            <label for="mascota">Mascota:</label>
            <input type="text" id="mascota" placeholder="Nombre de la mascota">

            <label for="especie">Especie:</label>
            <input type="text" id="especie" placeholder="Perro, gato, etc.">

            <label for="dueno">Dueño:</label>
            <input type="text" id="dueno" placeholder="Nombre del dueño">

            <button type="submit">Guardar</button>
        </form>

        <h3>Lista</h3>
        <table>
            <thead>
                <tr>
                    <th>Mascota</th>
                    <th>Especie</th>
                    <th>Dueño</th>
                </tr>
            </thead>
            <tbody id="tablaPacientes"></tbody>
        </table>

        <button type="button" id="btnVolver" class="btn-secundario">Volver</button>
    </div>

    <script src="modal.js"></script>
    <script src="auth.js"></script>
    <script src="pacientes.js"></script>
</body>
</html>
