<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pacientes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="caja" style="width: 450px;">
        <h2>Pacientes</h2>

        <label>Mascota:</label>
        <input type="text" id="mascota" placeholder="Nombre de la mascota">

        <label>Especie:</label>
        <input type="text" id="especie" placeholder="Perro, gato, etc.">

        <label>Dueño:</label>
        <input type="text" id="dueno" placeholder="Nombre del dueño">

        <button onclick="guardarPaciente()">Guardar</button>

        <h3>Lista</h3>
        <table border="1">
            <thead>
                <tr>
                    <th>Mascota</th>
                    <th>Especie</th>
                    <th>Dueño</th>
                </tr>
            </thead>
            <tbody id="tablaPacientes"></tbody>
        </table>

        <button onclick="window.location.href='dashboard.html'" style="background-color: #6c757d;">Volver</button>
    </div>

    <script src="pacientes.js"></script>
</body>
</html>
