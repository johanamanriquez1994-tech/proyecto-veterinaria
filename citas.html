<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Citas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="caja" style="width: 450px;">
        <h2>Citas Médicas</h2>

        <label>Paciente:</label>
        <input type="text" id="pacienteCita" placeholder="Nombre de la mascota">

        <label>Fecha:</label>
        <!-- Aquí agregamos el min para bloquear los días pasados -->
        <input type="date" id="fechaCita" min="2026-11-01">

        <label>Hora:</label>
        <input type="time" id="horaCita">

        <button onclick="guardarCita()">Agendar</button>

        <h3>Listado de Citas</h3>
        <table border="1">
            <thead>
                <tr>
                    <th>Paciente</th>
                    <th>Fecha</th>
                    <th>Hora</th>
                </tr>
            </thead>
            <tbody id="tablaCitas"></tbody>
        </table>

        <button onclick="window.location.href='dashboard.html'" style="background-color: #6c757d;">Volver</button>
    </div>

    <script src="citas.js"></script>
</body>
</html>
