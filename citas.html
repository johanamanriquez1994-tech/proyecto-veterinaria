<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Citas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="caja caja-ancha" id="cajaCitas">
        <h2>Citas Médicas</h2>

        <form id="formCita" novalidate>
            <label for="pacienteCita">Paciente:</label>
            <input type="text" id="pacienteCita" placeholder="Nombre de la mascota">

            <label for="horaCita">Hora:</label>
            <input type="time" id="horaCita">

            <button type="submit">Agendar</button>
        </form>

        <h3>Listado de Citas</h3>
        <table>
            <thead>
                <tr>
                    <th>Paciente</th>
                    <th>Fecha</th>
                    <th>Hora</th>
                </tr>
            </thead>
            <tbody id="tablaCitas"></tbody>
        </table>

        <button type="button" id="btnVolver" class="btn-secundario">Volver</button>
    </div>

    <script src="modal.js"></script>
    <script src="auth.js"></script>
    <script src="citas.js"></script>
</body>
</html>
