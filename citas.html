<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Veterinaria - Agendamiento de Citas</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <nav class="navbar">
        <a href="dashboard.html" class="navbar-brand">
            <i class="fas fa-paw" style="color: #319795;"></i>
            <span>Veterinaria</span>
        </a>
        <div class="nav-links">
            <a href="dashboard.html">Inicio</a>
            <a href="pacientes.html">Pacientes</a>
            <a href="citas.html" class="active">Citas</a>
            <button id="btnLogout" class="btn-logout">Cerrar Sesión</button>
        </div>
    </nav>

    <div style="padding: 2rem; max-width: 1200px; margin: 0 auto;">
        <h2 style="color: #ffffff; text-shadow: 0 2px 4px rgba(0,0,0,0.5); margin-bottom: 1.5rem;">Agendamiento de Citas Médicas</h2>

        <div id="alertBox" class="alert alert-error" style="display: none; background-color: #fed7d7; color: #9b2c2c; padding: 0.8rem; border-radius: 8px; margin-bottom: 1rem;"></div>

        <!-- FORMULARIO DE NUEVA CITA -->
        <div style="background: rgba(255, 255, 255, 0.95); padding: 1.5rem; border-radius: 10px; box-shadow: 0 6px 16px rgba(0,0,0,0.15); margin-bottom: 2rem;">
            <h3 style="color: #2d3748; margin-bottom: 1rem;">Agendar Nueva Cita</h3>
            
            <form id="citaForm" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
                <div class="form-group">
                    <label for="selectMascota">Mascota / Paciente</label>
                    <select id="selectMascota" class="form-control" required>
                        <option value="">Selecciona una mascota...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="fechaCita">Fecha</label>
                    <input type="date" id="fechaCita" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="horaCita">Hora</label>
                    <input type="time" id="horaCita" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="motivoCita">Motivo de Consulta</label>
                    <input type="text" id="motivoCita" class="form-control" placeholder="Ej: Vacunación, Control general" required>
                </div>

                <div class="form-group" style="grid-column: 1 / -1;">
                    <button type="submit" class="btn-primary" style="width: auto; padding: 0.8rem 2rem;">Confirmar Cita</button>
                </div>
            </form>
        </div>

        <!-- TABLA DE CITAS AGENDADAS -->
        <div style="background: rgba(255, 255, 255, 0.95); padding: 1.5rem; border-radius: 10px; box-shadow: 0 6px 16px rgba(0,0,0,0.15); overflow-x: auto;">
            <h3 style="color: #2d3748; margin-bottom: 1rem;">Citas Agendadas</h3>
            
            <table style="width: 100%; border-collapse: collapse; text-align: left;">
                <thead>
                    <tr style="border-bottom: 2px solid #e2e8f0; color: #4a5568;">
                        <th style="padding: 0.75rem;">Mascota</th>
                        <th style="padding: 0.75rem;">Dueño</th>
                        <th style="padding: 0.75rem;">Fecha</th>
                        <th style="padding: 0.75rem;">Hora</th>
                        <th style="padding: 0.75rem;">Motivo</th>
                        <th style="padding: 0.75rem;">Acción</th>
                    </tr>
                </thead>
                <tbody id="tablaCitas">
                    <!-- Se carga dinámicamente con JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
